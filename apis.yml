aid: matera
name: Matera
description: 'Matera is a French proptech company providing a digital platform for condominium
  management (syndic de copropriété), rental property management (gestion locative), and
  real estate transactions. Founded in Paris, Matera lets co-owners self-manage their
  buildings with software backed by 200+ in-house accountants, lawyers, and works experts,
  plus embedded services such as building insurance, legal protection, and a Treezor-powered
  payment account. It serves 150,000+ co-owners across France and is a certified B Corporation.'
